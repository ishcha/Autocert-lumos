[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumos"
version = "0.1.0"
description = "Interpreter for Lumos, a language for specifying and certifying language-model behaviour"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-SA-4.0" }
dependencies = []

[project.optional-dependencies]
local = ["transformers", "torch", "accelerate"]   # LocalModel (--hf-model)
vllm = ["openai", "httpx", "requests"]            # --model / --server-addr
stats = ["statsmodels"]                           # wilson, normal, agresti_coull certifiers

[project.scripts]
lumos = "lumos.cli:main"

[tool.setuptools]
packages = ["lumos"]
